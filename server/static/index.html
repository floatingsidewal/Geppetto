<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geppetto — picture to 3D model</title>
<style>
  :root {
    --bg: #f7f6f3; --panel: #fff; --ink: #1b1a17; --muted: #6b6862;
    --line: #e2ded6; --accent: #a4551f; --accent-ink: #fff;
    --ok: #2f6b3a; --err: #a32d24; --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --panel: #201f24; --ink: #ece9e3; --muted: #9b968d;
      --line: #33313a; --accent: #d2803f; --accent-ink: #17161a;
      --ok: #7fb98a; --err: #e08b82; --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17161a; --panel: #201f24; --ink: #ece9e3; --muted: #9b968d;
    --line: #33313a; --accent: #d2803f; --accent-ink: #17161a;
    --ok: #7fb98a; --err: #e08b82; --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 2rem 1rem;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: .9rem; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow);
  }
  #drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 2.5rem 1rem;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: rgba(164,85,31,.05); }
  #drop.has-file { padding: 1rem; }
  #preview { max-width: 100%; max-height: 220px; border-radius: 6px; display: block; margin: 0 auto .75rem; }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end; }
  .field { flex: 1 1 150px; min-width: 140px; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .3rem; }
  select, input[type=text] {
    width: 100%; padding: .5rem; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font: inherit; font-size: .9rem;
  }
  .checks { display: flex; gap: 1rem; flex-wrap: wrap; }
  .checks label { display: flex; align-items: center; gap: .35rem; color: var(--ink); font-size: .9rem; margin: 0; cursor: pointer; }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px;
    padding: .7rem 1.5rem; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .status { font-size: .9rem; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: .75rem 0; }
  .bar div { height: 100%; width: 30%; background: var(--accent); border-radius: 2px; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .files { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: .75rem; }
  .files a {
    display: inline-block; padding: .5rem .9rem; border: 1px solid var(--line);
    border-radius: 6px; text-decoration: none; color: var(--ink); font-size: .9rem;
  }
  .files a:hover { border-color: var(--accent); color: var(--accent); }
  .meta { color: var(--muted); font-size: .8rem; margin-top: .5rem; }
  details { margin-top: 1rem; } summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  .warn { color: var(--err); font-size: .85rem; margin-top: .5rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Geppetto</h1>
    <div class="sub">A picture goes in. A 3D model comes out.</div>
  </header>

  <div class="card">
    <div id="drop">
      <img id="preview" hidden alt="">
      <div id="dropText"><strong>Choose an image</strong><br><span class="sub">or drag one here — PNG, JPEG, WebP</span></div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <div class="row" style="margin-top:1.25rem">
      <div class="field">
        <label for="res">Detail</label>
        <select id="res">
          <option value="512">512 — fast draft</option>
          <option value="1024" selected>1024 — standard</option>
          <option value="1536">1536 — maximum</option>
        </select>
      </div>
      <div class="field">
        <label for="tex">Texture</label>
        <select id="tex">
          <option value="1024">1024</option>
          <option value="2048" selected>2048</option>
          <option value="4096">4096</option>
        </select>
      </div>
      <div class="field">
        <label>Also export</label>
        <div class="checks">
          <label><input type="checkbox" id="stl" checked> STL</label>
          <label><input type="checkbox" id="obj"> OBJ</label>
          <label><input type="checkbox" id="ply"> PLY</label>
        </div>
      </div>
    </div>

    <div style="margin-top:1.25rem; display:flex; align-items:center; gap:1rem;">
      <button id="go" disabled>Make it real</button>
      <span class="status" id="status"></span>
    </div>
    <div class="bar" id="bar" hidden><div></div></div>
    <div class="files" id="files"></div>
    <div class="meta" id="meta"></div>
  </div>

  <!-- Required by the Meta DINOv3 License: "Built with DINOv3" must be shown
       prominently wherever the materials are made available to a third party.
       Do not remove. -->
  <p class="meta" style="margin-bottom:1rem">
    Built with DINOv3 · powered by <a href="https://github.com/microsoft/TRELLIS.2"
    style="color:var(--muted)">Microsoft TRELLIS.2</a>
  </p>

  <details>
    <summary>Server settings</summary>
    <div class="card" style="margin-top:.75rem">
      <label for="url">API base URL</label>
      <input type="text" id="url" placeholder="http://localhost:8080">
      <div class="meta" id="health">not connected</div>
    </div>
  </details>
</div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const drop = $("drop"), fileIn = $("file"), preview = $("preview"), dropText = $("dropText");
  const go = $("go"), statusEl = $("status"), bar = $("bar"), filesEl = $("files"), metaEl = $("meta");
  const urlIn = $("url"), healthEl = $("health");

  // Served from the API (http://host:8080/app) -> same origin, no CORS involved.
  // Opened from disk (file://) -> origin is "null", so fall back to a sensible
  // default and let the user point it wherever the server actually lives.
  const servedOrigin = location.protocol.startsWith("http") ? location.origin : "";
  const saved = (() => { try { return localStorage.getItem("geppetto.url"); } catch { return null; } })();
  urlIn.value = saved || servedOrigin || "http://localhost:8080";

  const base = () => urlIn.value.replace(/\/+$/, "");
  let chosen = null;

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  async function checkHealth() {
    try {
      const r = await fetch(base() + "/healthz");
      const h = await r.json();
      healthEl.textContent = h.model_loaded
        ? `ready — ${h.gpu_name} (${h.gpu_free_gb} GB free)`
        : (h.load_error ? `load error: ${h.load_error}` : "model still loading…");
      healthEl.style.color = h.model_loaded ? "var(--ok)" : "var(--muted)";
      return h.model_loaded;
    } catch (e) {
      healthEl.textContent = `cannot reach ${base()} — check the URL, and that the server allows this page`;
      healthEl.style.color = "var(--err)";
      return false;
    }
  }
  urlIn.addEventListener("change", () => {
    try { localStorage.setItem("geppetto.url", urlIn.value); } catch {}
    checkHealth();
  });
  checkHealth();

  // --- file selection ---
  drop.addEventListener("click", () => fileIn.click());
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("over");
    if (e.dataTransfer.files.length) pick(e.dataTransfer.files[0]);
  });
  fileIn.addEventListener("change", () => { if (fileIn.files.length) pick(fileIn.files[0]); });

  function pick(f) {
    if (!f.type.startsWith("image/")) { setStatus("That is not an image.", "err"); return; }
    chosen = f;
    preview.src = URL.createObjectURL(f);
    preview.hidden = false;
    drop.classList.add("has-file");
    dropText.innerHTML = `<strong>${f.name}</strong><br><span class="sub">${(f.size/1024).toFixed(0)} KB — click to change</span>`;
    go.disabled = false;
    setStatus("");
    filesEl.innerHTML = ""; metaEl.textContent = "";
  }

  // --- generation ---
  go.addEventListener("click", async () => {
    if (!chosen) return;
    go.disabled = true; bar.hidden = false;
    filesEl.innerHTML = ""; metaEl.textContent = "";
    setStatus("Submitting…");

    const formats = ["stl", "obj", "ply"].filter(f => $(f).checked);
    const params = {
      resolution: Number($("res").value),
      texture_size: Number($("tex").value),
      export_formats: formats,
    };

    try {
      const fd = new FormData();
      fd.append("image", chosen, chosen.name);
      fd.append("params", JSON.stringify(params));

      const r = await fetch(base() + "/v1/generate", { method: "POST", body: fd });
      if (!r.ok) throw new Error((await r.text()) || `HTTP ${r.status}`);
      const { job_id } = await r.json();

      const started = Date.now();
      for (;;) {
        await new Promise(res => setTimeout(res, 3000));
        const jr = await fetch(`${base()}/v1/jobs/${job_id}`);
        if (!jr.ok) throw new Error(`polling failed: HTTP ${jr.status}`);
        const job = await jr.json();
        const secs = Math.round((Date.now() - started) / 1000);

        if (job.status === "completed") {
          setStatus(`Done in ${secs}s`, "ok");
          bar.hidden = true;
          const stem = chosen.name.replace(/\.[^.]+$/, "");
          for (const [kind, path] of Object.entries(job.artifacts)) {
            if (!path || kind === "input_image") continue;
            const ext = path.split(".").pop();
            const a = document.createElement("a");
            a.href = base() + path;
            a.download = `${stem}.${ext}`;
            a.textContent = `Download ${ext.toUpperCase()}`;
            filesEl.appendChild(a);
          }
          const bits = [];
          if (job.face_count) bits.push(`${job.face_count.toLocaleString()} faces`);
          if (job.peak_vram_gb) bits.push(`${job.peak_vram_gb} GB peak VRAM`);
          if (job.effective_seed) bits.push(`seed ${job.effective_seed}`);
          metaEl.textContent = bits.join(" · ");
          if (job.warnings && job.warnings.length) {
            const w = document.createElement("div");
            w.className = "warn";
            w.textContent = job.warnings.join(" ");
            metaEl.appendChild(w);
          }
          break;
        }
        if (job.status === "failed") throw new Error(job.error || "generation failed");

        setStatus(job.status === "queued"
          ? `Queued (position ${job.queue_position ?? "?"})… ${secs}s`
          : `Generating… ${secs}s`);
      }
    } catch (err) {
      setStatus(String(err.message || err), "err");
      bar.hidden = true;
    } finally {
      go.disabled = false;
    }
  });
})();
</script>
</body>
</html>
