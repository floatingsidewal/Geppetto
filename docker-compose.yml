name: geppetto

# ---------------------------------------------------------------------------
# Geppetto — a picture goes in, a 3D model comes out.
#
#   docker compose up -d                    # API on :${API_PORT}, web UI at /app
#   docker compose --profile ui up -d       # + upstream Gradio demo on :${UI_PORT}
#   docker compose --profile scale up -d    # + a second worker on the other GPU
#
# By default this builds the target matching this machine. Set GEPPETTO_TARGET
# to build the other one (see docker/targets/*.args), though each target must be
# built on its own CPU architecture.
#
# To run a published image instead of building, set
#   GEPPETTO_IMAGE=ghcr.io/floatingsidewal/geppetto:nvidia-cuda-latest
# ---------------------------------------------------------------------------

x-geppetto-common: &geppetto-common
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      # Compose cannot read docker/targets/*.args directly. These mirror
      # nvidia-cuda.args; for the dgx-spark target use scripts/build.sh, which
      # reads the target file as the single source of truth.
      BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:12.4.1-devel-ubuntu22.04}
      CUDA_ARCH: ${CUDA_ARCH:-8.9}
      PYTHON_VERSION: ${PYTHON_VERSION:-3.10}
      GEPPETTO_TARGET: ${GEPPETTO_TARGET:-nvidia-cuda}
  # Defaults to the image for GEPPETTO_TARGET, so a DGX Spark picks up
  # geppetto:dgx-spark rather than silently trying to BUILD the x86 target on
  # arm64 — which is what a hardcoded default does, and it looks like a hang.
  image: ${GEPPETTO_IMAGE:-geppetto:${GEPPETTO_TARGET:-nvidia-cuda}}
  environment: &geppetto-env
    HF_HOME: /models
    HF_TOKEN: ${HF_TOKEN:-}
    HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    # Valid values are exactly: flash_attn, flash_attn_3, xformers. Anything
    # else is silently ignored by upstream's validator, so a typo here does not
    # error — it just quietly keeps the image default. Underscores, not hyphens.
    ATTN_BACKEND: ${ATTN_BACKEND:-flash_attn}
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    OPENCV_IO_ENABLE_OPENEXR: "1"
    NVIDIA_DRIVER_CAPABILITIES: all
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Once the weights are in the volume, set HF_HUB_OFFLINE=1 in .env and the
    # container never contacts Hugging Face: no revision check at startup, no
    # dependency on the token or on the gated grants still being valid.
    HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    # Origins allowed to call the API from a browser. The default is permissive
    # so the single-page app works when opened straight off disk (file:// pages
    # send Origin: null). Restrict this if the service leaves a trusted network.
    GEPPETTO_CORS_ORIGINS: ${GEPPETTO_CORS_ORIGINS:-*}
  volumes:
    - models:/models
    - ./outputs:/outputs
    - ./inputs:/inputs:ro
  shm_size: "16gb"
  ipc: host
  # Run an init as PID 1. uvicorn does not reap children, and the CUDA/model
  # stack spawns plenty; without this, exiting containers can end up unkillable
  # zombies that block `compose up` from recreating them.
  init: true
  restart: unless-stopped

services:
  # --- REST API + web UI, pinned to one GPU -------------------------------
  api:
    <<: *geppetto-common
    container_name: geppetto-api
    environment:
      <<: *geppetto-env
      # GPU selection, done where it actually holds. `deploy.device_ids` maps to
      # a CDI device (nvidia.com/gpu=N); under WSL2 that is unresolvable and
      # Docker silently falls back to exposing EVERY GPU — verified, and
      # NVIDIA_VISIBLE_DEVICES does not filter there either, because /dev/dxg
      # hands the container all adapters. CUDA_VISIBLE_DEVICES is honoured by
      # PyTorch regardless of what the runtime exposed, so it is what makes
      # GPU_ID and the scale profile real rather than decorative.
      CUDA_VISIBLE_DEVICES: ${GPU_ID:-0}
    ports:
      - "${API_PORT:-8080}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      # First start loads ~16 GB of weights; do not flap during that.
      start_period: 15m
      retries: 3

  # --- Upstream Gradio demo (opt-in) --------------------------------------
  ui:
    <<: *geppetto-common
    container_name: geppetto-gradio
    profiles: ["ui"]
    working_dir: /opt/TRELLIS.2
    environment:
      <<: *geppetto-env
      CUDA_VISIBLE_DEVICES: ${GPU_ID:-0}
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
    command: ["python", "app.py"]
    ports:
      - "${UI_PORT:-7860}:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-0}"]
              capabilities: [gpu]

  # --- Scale-out: second worker on the other GPU (opt-in) ------------------
  # Enable with:  docker compose --profile scale up -d
  # Then round-robin your client between ${API_PORT} and ${API_PORT_2}, or put
  # a least-connections proxy in front of both.
  api2:
    <<: *geppetto-common
    container_name: geppetto-api2
    profiles: ["scale"]
    environment:
      <<: *geppetto-env
      CUDA_VISIBLE_DEVICES: ${GPU_ID_2:-1}
    ports:
      - "${API_PORT_2:-8081}:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID_2:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 15m
      retries: 3

volumes:
  models:
    # Deliberately keeps the old name through the rename: this volume holds ~21 GB
    # of downloaded weights, and renaming it would orphan them and force a full
    # re-download for no benefit.
    name: trellis2-models
